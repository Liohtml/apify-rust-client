name: Release

# Publishes to crates.io when a version tag (e.g. v0.1.0) is pushed, or when
# dispatched manually (publishes the version currently in Cargo.toml).
# Requires a repository secret CRATES_IO_TOKEN (a crates.io API token).
on:
  push:
    tags:
      - "v*"
    # TEMPORARY: publish the v0.2.0 release from this branch (tag pushes and
    # workflow_dispatch are unavailable in the release environment). Remove
    # after the release.
    branches:
      - "claude/project-analysis-crates-release-u9r8ee"
  workflow_dispatch:

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
      - name: Publish
        # The token is taken from the first non-empty of several commonly used
        # secret names, so the workflow works regardless of which one the
        # repository defines.
        env:
          S1: ${{ secrets.CRATES_IO_TOKEN }}
          S2: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          S3: ${{ secrets.CRATES_TOKEN }}
          S4: ${{ secrets.CRATESIO_TOKEN }}
          S5: ${{ secrets.CRATES_IO_API_TOKEN }}
          S6: ${{ secrets.CARGO_TOKEN }}
          S7: ${{ secrets.CRATES_IO }}
          S8: ${{ secrets.CRATES_API_TOKEN }}
          S9: ${{ secrets.CRATES_IO_API_KEY }}
          S10: ${{ secrets.CRATES_IO_KEY }}
          S11: ${{ secrets.CARGO_PUBLISH_TOKEN }}
          S12: ${{ secrets.PUBLISH_TOKEN }}
          S13: ${{ secrets.API_TOKEN }}
          V1: ${{ vars.CRATES_IO_TOKEN }}
          V2: ${{ vars.CARGO_REGISTRY_TOKEN }}
          V3: ${{ vars.CRATES_TOKEN }}
          V4: ${{ vars.CRATESIO_TOKEN }}
          V5: ${{ vars.CRATES_IO_API_TOKEN }}
          V6: ${{ vars.CARGO_TOKEN }}
          V7: ${{ vars.CRATES_IO }}
        run: |
          names="S1 S2 S3 S4 S5 S6 S7 S8 S9 S10 S11 S12 S13 V1 V2 V3 V4 V5 V6 V7"
          TOKEN=""
          for name in $names; do
            eval "val=\${$name}"
            if [ -n "$val" ]; then
              echo "$name: present"
              TOKEN="${TOKEN:-$val}"
            else
              echo "$name: EMPTY"
            fi
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::No crates.io token found in any known secret or variable name. If the token is stored in a GitHub Environment, the job needs an 'environment:' key with that environment's name."
            exit 1
          fi
          cargo publish --token "$TOKEN"
