name: Release

# Publishes to crates.io when a version tag (e.g. v0.1.0) is pushed, or when
# dispatched manually (publishes the version currently in Cargo.toml).
# Requires a repository secret CRATES_IO_TOKEN (a crates.io API token).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The CRATES_IO_TOKEN repository secret is empty or missing. Add a crates.io API token under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          cargo publish
