name: Release

# Publishes to crates.io when a version tag (e.g. v0.1.0) is pushed, or when
# dispatched manually (publishes the version currently in Cargo.toml).
# Requires a repository secret CRATES_IO_TOKEN (a crates.io API token).
on:
  push:
    tags:
      - "v*"
    # TEMPORARY: publish the v0.2.0 release from this branch (tag pushes and
    # workflow_dispatch are unavailable in the release environment). Remove
    # after the release.
    branches:
      - "claude/project-analysis-crates-release-u9r8ee"
  workflow_dispatch:

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
      - name: Publish
        # The token is taken from the first non-empty of several commonly used
        # secret names, so the workflow works regardless of which one the
        # repository defines.
        env:
          T_CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          T_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          T_CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
          T_CRATESIO_TOKEN: ${{ secrets.CRATESIO_TOKEN }}
          T_CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
          T_CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          for name in T_CRATES_IO_TOKEN T_CARGO_REGISTRY_TOKEN T_CRATES_TOKEN T_CRATESIO_TOKEN T_CRATES_IO_API_TOKEN T_CARGO_TOKEN; do
            eval "val=\${$name}"
            if [ -n "$val" ]; then echo "$name: present"; else echo "$name: EMPTY"; fi
          done
          TOKEN="${T_CRATES_IO_TOKEN:-${T_CARGO_REGISTRY_TOKEN:-${T_CRATES_TOKEN:-${T_CRATESIO_TOKEN:-${T_CRATES_IO_API_TOKEN:-${T_CARGO_TOKEN}}}}}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No crates.io token found in any known secret name (repo-level). If the token is stored in a GitHub Environment, the job needs an 'environment:' key."
            exit 1
          fi
          cargo publish --token "$TOKEN"
